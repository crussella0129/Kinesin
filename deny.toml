# cargo-deny supply-chain policy for Kinesin (INT-0013).
# Enforced in CI (see .github/workflows/ci.yml, the `supply-chain` job) plus
# `cargo audit`. The gate is deny-by-default: an unlisted license or a
# non-crates.io source fails the build. Every `ignore` below carries a rationale.

[graph]
all-features = true

[advisories]
version = 2
# RustSec advisory DB (default). `cargo audit` runs alongside as a second check.
# Ignored advisories MUST carry a one-line justification; none at authoring time.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Skip Kinesin's own unpublished crate (publish = false in Cargo.toml).
private = { ignore = true }
# Allow-list the permissive licenses actually present in the tree (verified via
# `cargo deny list`); deny by default. Multi-licensed crates (LGPL/Unlicense/
# BSL/MIT-0 dual-licensed) are satisfied by their MIT/Apache option, so those
# copyleft/other identifiers are intentionally NOT allowed here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",  # webpki-root-certs (Mozilla CA set), single-licensed
]

[bans]
multiple-versions = "deny"
wildcards = "deny"              # a wildcard version requirement is unpinned risk
allow = []
deny = []
# Reviewed against Cargo.lock, 2026-09-12. Only these exact nodes are exempt
# from duplicate detection; every other duplicate is an error. Review/remove
# stale exceptions whenever the requiring dependency changes. No skip-tree.
# The license/advisory/source checks still apply to skipped nodes.
skip = [
    { crate = "base64@=0.22.1", reason = "reqwest/hyper-util use 0.22; rmcp 3.3 uses 0.23. Remove when their major-version requirements converge." },
    { crate = "hashbrown@=0.16.1", reason = "rusqlite's wasm graph uses rsqlite-vfs 0.1 and hashbrown 0.16; hashlink/indexmap require 0.17. Keep the all-platform policy explicit." },
    { crate = "io-lifetimes@=2.0.4", reason = "cap-primitives uses fs-set-times 0.20, which needs io-lifetimes 2; cap-std/io-extras use 3. Remove after the fs-set-times transition." },
    { crate = "syn@=2.0.119", reason = "synstructure/tracing-attributes use syn 2; rmcp and current serde/tokio derives use syn 3. Proc-macro internals are separate." },
    { crate = "windows-sys@=0.52.0", reason = "cap-primitives' fs-set-times/io-extras/winx graph uses windows-sys 0.52; Kinesin/Tokio use 0.61. Remove after those safe-wrapper dependencies migrate." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
