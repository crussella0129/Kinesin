# cargo-deny supply-chain policy for Kinesin (INT-0013).
# Enforced in CI (see .github/workflows/ci.yml, the `supply-chain` job) plus
# `cargo audit`. The gate is deny-by-default: an unlisted license or a
# non-crates.io source fails the build. Every `ignore` below carries a rationale.

[graph]
all-features = true

[advisories]
version = 2
# RustSec advisory DB (default). `cargo audit` runs alongside as a second check.
# Ignored advisories MUST carry a one-line justification; none at authoring time.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Skip Kinesin's own unpublished crate (publish = false in Cargo.toml).
private = { ignore = true }
# Allow-list the permissive licenses actually present in the tree (verified via
# `cargo deny list`); deny by default. Multi-licensed crates (LGPL/Unlicense/
# BSL/MIT-0 dual-licensed) are satisfied by their MIT/Apache option, so those
# copyleft/other identifiers are intentionally NOT allowed here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",  # webpki-root-certs (Mozilla CA set), single-licensed
]

[bans]
multiple-versions = "warn"      # duplicate versions are noise, not a failure
wildcards = "deny"              # a wildcard version requirement is unpinned risk
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
