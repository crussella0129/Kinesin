[package]
name = "kinesin"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
# The reference implementation is not published to crates.io.
publish = false

# Do not inherit an unrelated ancestor manifest.
[workspace]
resolver = "3"

[dependencies]
axum = "0.8.9"
cap-std = "4.0.3"
command-group = { version = "5.0.1", default-features = false, features = ["with-tokio"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.32"
getrandom = "0.4.3"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["server", "http1", "tokio", "service"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util", "process", "test-util"] }
tokio-util = "0.7.19"
toml = "1.1.5"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

# A cross-platform, argv-driven fixture the command-tool tests spawn. It is test
# support only; integration tests reach it through CARGO_BIN_EXE_cmd-fixture.
[[bin]]
name = "cmd-fixture"
path = "src/bin/cmd-fixture.rs"
test = false
doc = false

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
