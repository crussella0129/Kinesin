[package]
name = "kinesin"
default-run = "kinesin"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
# The harness is not published to crates.io.
publish = false

# Do not inherit an unrelated ancestor manifest.
[workspace]
resolver = "3"

[dependencies]
axum = "0.8.9"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
eventsource-stream = "0.2.3"
futures-util = "0.3.32"
getrandom = "0.4.3"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["server", "http1", "tokio", "service"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
# The client uses bounded AsyncRwTransport with our owned process lifecycle.
# server + transport-io + macros also build the in-repo `mcp-fixture` server.
rmcp = { version = "3", features = ["client", "server", "transport-io", "macros"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
# Already in the tree via rmcp's server feature; named directly so the
# mcp-fixture test server can derive JsonSchema for its tool arguments. No new
# crate is added.
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util", "process", "test-util"] }
tokio-util = "0.7.19"
toml = "1.1.5"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

# A cross-platform, argv-driven fixture the command-tool tests spawn. It is test
# support only; integration tests reach it through CARGO_BIN_EXE_cmd-fixture.
[[bin]]
name = "cmd-fixture"
path = "src/bin/cmd-fixture.rs"
test = false
doc = false

# A minimal in-repo MCP server the tests/mcp.rs integration tests spawn over
# stdio, so MCP coverage needs no external server or network. Test support only;
# reached through CARGO_BIN_EXE_mcp-fixture.
[[bin]]
name = "mcp-fixture"
path = "src/bin/mcp-fixture.rs"
test = false
doc = false

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target.'cfg(target_os="linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
